# Chance (0.0 - 1.0) that a naturally spawned villager killed by a player
# drops a villager spawn egg.
egg-drop-chance: 0.05

# Ticks between each villager work action (plant or harvest one block).
work-interval-ticks: 60

# Netherite tier (tier 4) divides the work interval by this factor.
netherite-speed-multiplier: 2.0

# Vertical range (+/- blocks around the workstation Y level) scanned for farmland.
search-y-range: 3

# Ticks between workstation ambient particle refreshes.
particle-interval-ticks: 10

# Distance (blocks) a player must be within for workstation particles to spawn.
particle-view-distance-blocks: 48.0

# How far (blocks) the personal villager may wander from its workstation
# before it is guided back. Always covers the working area.
max-wander-distance-blocks: 10.0
